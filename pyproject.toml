[project]
name = "modulo1"
version = "0.1.0"
description = "Basic user and order example with SQLAlchemy, Alembic, and tests"
authors = [
    {name = "MarcosMarquezOvalle",email = "mmarquez17@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "SQLAlchemy>=2.0.0",
    "alembic>=1.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.poetry]
packages = [{include = "modulo1", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
